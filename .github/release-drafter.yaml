name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels:
      - "feature"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
  - title: "📖 Documentation"
    labels:
      - "documentation"
  - title: "🧹 Maintenance"
    labels:
      - "chore"

version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "feature"
  patch:
    labels:
      - "fix"
      - "documentation"
      - "chore"
  default: patch

autolabeler:
  - label: "feature"
    title:
      - "/^feat/i"
  - label: "fix"
    title:
      - "/^fix/i"
  - label: "documentation"
    title:
      - "/^docs/i"
  - label: "chore"
    title:
      - "/^chore/i"
      - "/^ci/i"
      - "/^refactor/i"

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
