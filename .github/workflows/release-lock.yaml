name: Release Lock Check

on:
  pull_request:
    branches:
      - main
  merge_group:

jobs:
  check-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check release lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api repos/${{ github.repository }}/branches/release-lock --silent 2>/dev/null; then
            echo "::error::リリースロック中です。mainへのマージはブロックされています。"
            exit 1
          fi
          echo "リリースロックなし。マージ可能です。"
